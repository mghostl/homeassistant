command_line:
  - sensor:
      name: Network probe
      unique_id: network_probe
      scan_interval: 60
      command_timeout: 18
      value_template: "{{ value_json.status }}"
      json_attributes:
        - gateway_address
        - gateway_router
        - checked_at
        - gateway_latency
        - gateway_loss
        - internet_latency
        - internet_loss
        - wifi_signal
      command: |
        python3 - <<'PY'
        import json
        import re
        import subprocess
        from datetime import datetime, timezone
        from http.client import HTTPConnection, HTTPException
        from pathlib import Path

        def ping(target):
            if not target:
                return None, None
            try:
                result = subprocess.run(
                    ["ping", "-n", "-c", "3", "-i", "0.2", "-W", "1", "-w", "4", target],
                    capture_output=True, text=True, timeout=5,
                )
            except subprocess.TimeoutExpired:
                return None, None
            loss = re.search(r"([\d.]+)% packet loss", result.stdout)
            latency = re.search(r"(?:round-trip|rtt) [^=]+ = [\d.]+/([\d.]+)/", result.stdout)
            if "Network unreachable" in result.stderr or "Network is unreachable" in result.stderr:
                return None, 100
            return (
                round(float(latency[1]), 1) if latency else None,
                float(loss[1]) if loss else None,
            )

        def read_gateway_router(gateway):
            if not gateway:
                return {}
            connection = HTTPConnection(gateway, timeout=2)
            try:
                connection.request("GET", "/cgi-bin/luci/api/xqsystem/init_info")
                response = connection.getresponse()
                if response.status != 200:
                    return {}
                info = json.loads(response.read(32768))
            except (OSError, HTTPException, ValueError):
                return {}
            finally:
                connection.close()
            if not isinstance(info, dict) or info.get("code") != 0:
                return {}
            model = info.get("model")
            if not isinstance(model, str) or not model.startswith("xiaomi.router."):
                return {}
            fields = {
                "model": "displayName",
                "hardware": "hardware",
                "firmware": "romversion",
                "country": "countrycode",
            }
            return {
                name: value.strip()
                for name, field in fields.items()
                if isinstance(value := info.get(field), str) and value.strip()
            }

        routes = subprocess.check_output(
            ["ip", "-4", "route", "show", "default"], text=True, timeout=2
        )
        route = re.search(r"^default via (\d+(?:\.\d+){3}) dev (\S+)", routes, re.MULTILINE)
        gateway, interface = route.groups() if route else (None, None)
        gateway_latency, gateway_loss = ping(gateway)
        internet_latency, internet_loss = ping("1.1.1.1")

        wireless = Path("/proc/net/wireless")
        signal = None
        if interface and wireless.exists():
            for line in wireless.read_text().splitlines()[2:]:
                name, values = line.split(":", 1)
                if name.strip() == interface:
                    level = float(values.split()[2])
                    if -127 <= level < 0:
                        signal = level
                    break

        print(json.dumps({
            "status": "ready",
            "gateway_address": gateway,
            "gateway_router": read_gateway_router(gateway),
            "checked_at": datetime.now(timezone.utc).isoformat(),
            "gateway_latency": gateway_latency,
            "gateway_loss": gateway_loss,
            "internet_latency": internet_latency,
            "internet_loss": internet_loss,
            "wifi_signal": signal,
        }))
        PY
  - binary_sensor:
      name: Network DNS resolution
      unique_id: network_dns_resolution
      device_class: connectivity
      scan_interval: 60
      command_timeout: 6
      payload_on: "ON"
      payload_off: "OFF"
      command: |
        python3 - <<'PY'
        from dns.exception import DNSException
        from dns.resolver import resolve

        try:
            resolve("example.com.", "A", lifetime=3)
        except DNSException:
            print("OFF")
        else:
            print("ON")
        PY

template:
  - binary_sensor:
      - name: Network gateway reachable
        unique_id: network_gateway_reachable
        device_class: connectivity
        availability: "{{ is_number(state_attr('sensor.network_probe', 'gateway_loss')) }}"
        state: "{{ state_attr('sensor.network_probe', 'gateway_loss') | float(100) < 100 }}"
      - name: Network internet reachable
        unique_id: network_internet_reachable
        device_class: connectivity
        availability: "{{ is_number(state_attr('sensor.network_probe', 'internet_loss')) }}"
        state: "{{ state_attr('sensor.network_probe', 'internet_loss') | float(100) < 100 }}"
    sensor:
      - name: Network gateway latency
        unique_id: network_gateway_latency
        device_class: duration
        unit_of_measurement: ms
        state_class: measurement
        availability: "{{ is_number(state_attr('sensor.network_probe', 'gateway_latency')) }}"
        state: "{{ state_attr('sensor.network_probe', 'gateway_latency') }}"
      - name: Network internet latency
        unique_id: network_internet_latency
        device_class: duration
        unit_of_measurement: ms
        state_class: measurement
        availability: "{{ is_number(state_attr('sensor.network_probe', 'internet_latency')) }}"
        state: "{{ state_attr('sensor.network_probe', 'internet_latency') }}"
      - name: Network gateway packet loss
        unique_id: network_gateway_packet_loss
        unit_of_measurement: "%"
        state_class: measurement
        availability: "{{ is_number(state_attr('sensor.network_probe', 'gateway_loss')) }}"
        state: "{{ state_attr('sensor.network_probe', 'gateway_loss') }}"
      - name: Network internet packet loss
        unique_id: network_internet_packet_loss
        unit_of_measurement: "%"
        state_class: measurement
        availability: "{{ is_number(state_attr('sensor.network_probe', 'internet_loss')) }}"
        state: "{{ state_attr('sensor.network_probe', 'internet_loss') }}"
      - name: Network Wi-Fi signal
        unique_id: network_wifi_signal
        default_entity_id: sensor.network_wifi_signal
        device_class: signal_strength
        unit_of_measurement: dBm
        state_class: measurement
        availability: "{{ is_number(state_attr('sensor.network_probe', 'wifi_signal')) }}"
        state: "{{ state_attr('sensor.network_probe', 'wifi_signal') }}"
