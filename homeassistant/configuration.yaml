
# Loads default set of integrations. Do not remove.
default_config:

# Host monitoring is kept in a separate, deployable YAML file.
command_line: !include raspberry-pi-sensors.yaml

homeassistant:
  packages: !include_dir_named packages

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Store useful operational history while excluding high-churn Roborock entities
# to reduce write pressure on the Raspberry Pi SD card.
recorder:
  purge_keep_days: 10
  auto_purge: true
  auto_repack: true
  commit_interval: 30
  include:
    domains:
      - sensor
      - binary_sensor
  exclude:
    domains:
      - device_tracker
      - update
    entity_globs:
      - binary_sensor.roborock_qrevo_master_*
      - button.roborock_qrevo_master_*
      - image.roborock_qrevo_master_*
      - number.roborock_qrevo_master_*
      - select.roborock_qrevo_master_*
      - sensor.roborock_qrevo_master_*
      - switch.roborock_qrevo_master_*
    entities:
      - sun.sun

input_boolean:
  daily_vacuum_enabled:
    name: Daily vacuum enabled
    icon: mdi:robot-vacuum

input_datetime:
  daily_vacuum_last_run:
    name: Daily vacuum last started
    has_date: true
    has_time: false
    icon: mdi:calendar-check
  daily_vacuum_last_completed:
    name: Daily vacuum last completed
    has_date: true
    has_time: false
    icon: mdi:calendar-check
  daily_vacuum_started_at:
    name: Daily vacuum started at
    has_date: true
    has_time: true
    icon: mdi:clock-start

lovelace:
  resource_mode: yaml
  resources:
    - url: /local/resource-breakdown-card.js?v=2
      type: module
  dashboards:
    dashboard-raspberry-pi:
      mode: yaml
      filename: dashboards/raspberry-pi.yaml
      title: Raspberry Pi
      icon: mdi:raspberry-pi
      show_in_sidebar: true
    dashboard-vacuum:
      mode: yaml
      filename: dashboards/vacuum.yaml
      title: Vacuum
      icon: mdi:robot-vacuum
      show_in_sidebar: true

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
