title: Raspberry Pi
views:
  - title: Overview
    path: overview
    icon: mdi:raspberry-pi
    cards:
      - type: entities
        title: Resource alerts
        show_header_toggle: false
        state_color: true
        entities:
          - entity: binary_sensor.raspberry_pi_high_temperature
            name: High temperature
          - entity: binary_sensor.raspberry_pi_storage_warning
            name: Storage warning
          - entity: binary_sensor.raspberry_pi_storage_critical
            name: Storage critical
          - entity: binary_sensor.raspberry_pi_low_available_memory
            name: Low available memory
          - entity: binary_sensor.raspberry_pi_sustained_cpu_load
            name: Sustained CPU load
          - entity: binary_sensor.raspberry_pi_monitoring_stopped
            name: Monitoring stopped
      - type: gauge
        entity: sensor.raspberry_pi_cpu_temperature
        name: CPU temperature
        min: 0
        max: 100
        needle: true
        severity:
          green: 0
          yellow: 70
          red: 80
      - type: gauge
        entity: sensor.raspberry_pi_cpu_usage
        name: CPU usage
        tap_action:
          action: navigate
          navigation_path: /dashboard-raspberry-pi/resources
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 70
          red: 90
      - type: gauge
        entity: sensor.raspberry_pi_memory_usage
        name: Memory usage
        tap_action:
          action: navigate
          navigation_path: /dashboard-raspberry-pi/resources
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 80
          red: 95
      - type: gauge
        entity: sensor.raspberry_pi_disk_usage
        name: Home Assistant storage usage
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 80
          red: 90
      - type: entities
        title: Host details
        show_header_toggle: false
        entities:
          - entity: sensor.raspberry_pi_last_boot
            name: Last boot
          - entity: sensor.raspberry_pi_load_5m
            name: System load (5 minutes)
          - entity: sensor.raspberry_pi_disk_free
            name: Storage available
      - type: custom:resource-breakdown-card
        title: CPU and memory — select a point
        compact: true
      - type: history-graph
        title: CPU temperature — 24 hours
        hours_to_show: 24
        entities:
          - entity: sensor.raspberry_pi_cpu_temperature
            name: CPU temperature
  - title: History
    path: history
    icon: mdi:chart-line
    cards:
      - type: statistics-graph
        title: Resource usage — 7 days
        chart_type: line
        period: hour
        days_to_show: 7
        stat_types:
          - mean
        entities:
          - sensor.raspberry_pi_cpu_usage
          - sensor.raspberry_pi_memory_usage
          - sensor.raspberry_pi_disk_usage
      - type: statistics-graph
        title: CPU temperature — 7 days
        chart_type: line
        period: hour
        days_to_show: 7
        stat_types:
          - mean
          - max
        entities:
          - sensor.raspberry_pi_cpu_temperature
  - title: Resource breakdown
    path: resources
    icon: mdi:format-list-bulleted
    cards:
      - type: custom:resource-breakdown-card
        title: Host resource breakdown
      - type: history-graph
        title: CPU — containers and other host processes
        hours_to_show: 24
        entities:
          - entity: sensor.raspberry_pi_container_cpu
            name: Containers
          - entity: sensor.raspberry_pi_host_process_cpu
            name: Other host processes
      - type: history-graph
        title: Resident memory — shared pages may be counted more than once
        hours_to_show: 24
        entities:
          - entity: sensor.raspberry_pi_container_rss
            name: Containers
          - entity: sensor.raspberry_pi_host_process_rss
            name: Other host processes
